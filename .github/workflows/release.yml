name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.3 or v0.2.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Release (.exe + latest.json)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust GNU toolchain (with MinGW windres for .exe icon)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Add MSYS2 MinGW64 (windres) to PATH
        shell: pwsh
        run: |
          if (Test-Path "C:\msys64\mingw64\bin") {
            "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          }

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Resolve version & tag
        id: meta
        shell: pwsh
        run: |
          $tag = if ("${{ inputs.tag }}" -ne "") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          $ver = $tag.TrimStart('v', 'V')
          $asset = "gxnu-campus-net-helper-v$ver.exe"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "asset=$asset" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Run unit tests
        shell: pwsh
        env:
          GXNU_APP_VERSION: ${{ steps.meta.outputs.version }}
        run: cargo test --locked --target x86_64-pc-windows-gnu

      - name: Build release binary
        shell: pwsh
        env:
          GXNU_APP_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          cargo build --locked --release --target x86_64-pc-windows-gnu
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Force "target/x86_64-pc-windows-gnu/release/gxnu-guard.exe" "dist/${{ steps.meta.outputs.asset }}"

      - name: Generate SHA256SUMS & latest.json manifest
        shell: pwsh
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          ASSET: ${{ steps.meta.outputs.asset }}
        run: |
          $exePath = "dist/$env:ASSET"
          $hash = (Get-FileHash -Path $exePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item $exePath).Length
          "$hash  $env:ASSET" | Set-Content -Encoding utf8 "dist/SHA256SUMS.txt"

          $notes = ""
          if (Test-Path "CHANGELOG.md") {
            $raw = Get-Content -Raw -Encoding UTF8 "CHANGELOG.md"
            if ($raw -match "(?ms)^##\s+v?$([regex]::Escape($env:VERSION))\b[^\r\n]*\r?\n(.*?)(?=^---\s*$|^##\s+|\z)") {
              $notes = $Matches[1].Trim()
            }
          }
          if ([string]::IsNullOrWhiteSpace($notes)) {
            $notes = "GXNU 校园网守护助手 v$env:VERSION 正式版更新。"
          }

          $manifest = [ordered]@{
            version      = $env:VERSION
            tag          = $env:TAG
            asset_name   = $env:ASSET
            download_url = "https://github.com/$env:REPO/releases/download/$env:TAG/$env:ASSET"
            html_url     = "https://github.com/$env:REPO/releases/tag/$env:TAG"
            sha256       = $hash
            size         = $size
            published_at = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            notes        = $notes
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 "dist/latest.json"
          $releaseLines = @(
            '### ✨ 更新内容',
            '',
            $notes,
            '',
            '---',
            '',
            '### 📦 下载与使用',
            '',
            ('- 直接下载下方 **`{0}`** 放入固定文件夹双击运行即可（绿色单文件，免安装免解压）。' -f $env:ASSET),
            '- 若已安装 `v0.2.2+`：可直接在主窗口顶栏或「设置 → 监控与自启 → 检查更新」中一键原位自动升级，原有账号密码与自启配置均自动无损保留。',
            ('- **SHA-256**：`{0}` ({1})' -f $hash, $env:ASSET)
          )
          ($releaseLines -join "`n") | Set-Content -Encoding utf8 "dist/RELEASE_NOTES.md"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "GXNU 校园网守护助手 ${{ steps.meta.outputs.tag }}"
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: false
          files: |
            dist/${{ steps.meta.outputs.asset }}
            dist/latest.json
            dist/SHA256SUMS.txt
